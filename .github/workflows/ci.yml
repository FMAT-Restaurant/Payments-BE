name: CI/CD Pipeline

on:
  push:
    branches: ["main", "qa"]
  pull_request:
    branches: ["main", "qa"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-verify:
    name: "Build, Lint & Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ConnectionStrings__SqlServer: "Server=localhost,1433;Database=payments_tests;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True"
    # ChargeServiceTests run against a real SQL Server (transactions, sequence, unique index, outbox).
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P '${{ secrets.MSSQL_SA_PASSWORD }}' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-retries 20

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Java 17 es requerido internamente por el analizador de SonarQube
      - name: "setup Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: "install dependencies"
        run: dotnet restore

      - name: "verify formatting (lint)"
        run: dotnet format --verify-no-changes

      # Instalamos la herramienta global de SonarScanner para .NET
      - name: "Install SonarScanner for .NET"
        run: dotnet tool install --global dotnet-sonarscanner

      # Iniciamos el escáner ANTES del build
      - name: "SonarQube Scan Begin"
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin 
          /k:"FMAT-Restaurant_Payments-BE" 
          /o:"fmat-restaurant" 
          /d:sonar.token="${{ env.SONAR_TOKEN }}" 
          /d:sonar.host.url="https://sonarcloud.io" 
          /d:sonar.qualitygate.wait=true 
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "build"
        run: dotnet build --no-restore --configuration Release

      - name: "run tests"
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Finalizamos el escáner DESPUÉS del build y las pruebas
      - name: "SonarQube Scan End"
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord notification on failure
        if: failure()
        uses: Ilshidur/action-discord@ad5235de713df3ef38022185499b02ffe93b7efe
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with: 
          args: 'Pipeline de CI falló en ${{ github.ref_name }} por ${{ github.actor }}'
